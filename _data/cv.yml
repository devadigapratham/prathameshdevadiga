    Projects:
      - name: "Cerebrum: Production LLM Training and Serving System (2025)"
        summary: Independent research project
        highlights:
          - End-to-end LLM system with distributed FSDP/DDP training, Flash Attention v2, and Mixture-of-Experts support.
          - Developed Mixture-of-Refusals, a conditional safety-routing mechanism giving 2-3x speedups on safe queries with identical safety guarantees.
          - vLLM-based inference with quantization, speculative decoding, and prefix caching; deployed with Docker, Kubernetes, and Prometheus.

      - name: "Arcane ML: Distributed Training Framework (2024)"
        summary: Open-source project
        highlights:
          - Framework for distributed training across SSH clusters, Modal cloud GPUs, and local setups, with PyTorch DDP support and a unified CLI.

