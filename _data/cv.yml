    Experience:
      - company: Dartmouth College
        position: Research Assistant (ML Security and LLM Privacy)
        location: Remote
        start_date: 2025-07
        end_date: 2026-07
        summary: "Advisor: Prof. Shawn Shan"
        highlights:
          - Co-developed CHASE (Correlated Hierarchical Adaptive Search for Extraction), a Gaussian-process bandit framework for query-efficient memorization extraction from instruction-tuned LLMs.
          - Found that the prompt space for memorization extraction has a low-rank, kernel-correlated structure, enabling effective prompt optimization with as few as 100 API queries per target passage.
          - Evaluated across 9 instruction-tuned LLMs from 7 model families, including production APIs, with up to 2.9x higher extraction success than random search and over 10x gains under seven defense strategies.
          - Showed that ordinary academic and continuation prompts consistently outperform adversarial jailbreaks for memorization extraction, exposing limits of prompt-level safety defenses.

      - company: Adhāra AI Labs
        position: Founder and Lead Researcher
        location: Remote
        start_date: 2025-02
        end_date: Present
        summary: Independent AI research lab
        url: https://aadhara-ai-labs.vercel.app
        highlights:
          - Founded an independent research lab focused on generative AI, LLMs, retrieval-augmented generation, and deep learning systems.
          - Research outputs include PyraFuseNet (ICIAI), SLMs as Compiler Experts (NeurIPS 2025 ML for Systems Workshop), RegimeNAS, MorphNAS, and a low-latency jailbreak prevention framework.

      - company: Lossfunk
        position: AI Research Intern
        location: Bangalore, India
        start_date: 2025-09
        end_date: 2026-06
        summary: Low-resource language modeling
        highlights:
          - Built an Indic LLM pipeline for extremely low-resource languages (Tulu, about 0.001% of typical training data volume).
          - Developed a hard-negative-constraint framework that reduced catastrophic language leakage from 80% to 5%, showing that explicit prohibitions outperform positive instructions.
          - Resulting paper accepted at the EACL 2026 Workshop on Language Models for Low-Resource Languages (LoResLM).

      - company: Nokia
        position: Intent-Based Network Management System (3GPP SON)
        location: Bengaluru, India
        start_date: 2025-08
        end_date: 2025-10
        summary: Industry internship
        highlights:
          - Designed an intent-based self-organizing network system that translates operators' natural-language goals into 3GPP-compliant intents.
          - Built an LLM-powered, retrieval-augmented intent classification pipeline mapping natural-language inputs to structured intent schemas.
          - Architected an orchestration layer with synchronous and asynchronous execution, conflict detection, duplicate suppression, and intent expiry management.

      - company: Google Summer of Code 2025, University of California Santa Cruz
        position: Contributor
        location: Remote
        start_date: 2025-05
        end_date: 2025-08
        summary: Billion-scale ANN benchmarking infrastructure
        highlights:
          - Built billion-scale vector embedding benchmarks (768, 1024, and 2048 dimensions) from open-source codebases for realistic evaluation of approximate nearest neighbor search.
          - Developed infrastructure for evaluating ANN algorithms at scale.

      - company: Indian Institute of Technology, Indore
        position: Undergraduate Research Intern (Deep Learning)
        location: Remote
        start_date: 2023-12
        end_date: 2024-08
        summary: "Advisor: Prof. Nagendra Kumar"
        highlights:
          - Designed the KASPER framework for PDF malware detection, reaching 99.5% accuracy and maintaining it under FGSM and PGD adversarial attacks.
          - Built a malware injection pipeline for realistic payload embedding, and led benchmarking and explainability analysis using Kolmogorov-Arnold Networks.
          - Work formed the core technical implementation of a paper in Applied Soft Computing.

